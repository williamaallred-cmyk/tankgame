<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank vs Computer 1v1 Battle</title>
    <!-- Tailwind CSS for sleek modern UI controls -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #121c12;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
            background: radial-gradient(circle, #223822 0%, #0d160d 100%);
        }
        .glow-green {
            box-shadow: 0 0 25px rgba(74, 222, 128, 0.4);
        }
    </style>
</head>
<body class="flex flex-col h-screen text-gray-100">

    <header class="bg-gray-900/90 backdrop-blur border-b border-emerald-800/50 p-4 flex flex-wrap justify-between items-center z-10 shadow-lg gap-y-3">
        <div class="flex items-center space-x-3">
            <div class="bg-emerald-600 text-white font-black px-3.5 py-1.5 rounded-xl text-lg tracking-wider glow-green">
                TANK DUEL
            </div>
            <p class="text-[10px] text-emerald-400 hidden xl:block max-w-[150px] leading-tight">WASD to Move • Mouse Aim • Click to Fire</p>
        </div>

        <!-- HUD Health & Score Status -->
        <div class="flex items-center space-x-3 text-sm flex-1 justify-center min-w-[300px]">
            <div class="flex items-center space-x-2 bg-emerald-950/70 px-3 py-1.5 rounded-xl border border-emerald-700/50 w-36 sm:w-44">
                <div class="flex flex-col w-full">
                    <span id="playerTankName" class="text-emerald-400 font-bold text-[10px] truncate">PLAYER</span>
                    <div class="w-full bg-gray-900 rounded-sm h-3 relative border border-emerald-900 overflow-hidden mt-0.5">
                        <div id="playerHpBar" class="bg-emerald-500 h-full w-full transition-all duration-200" style="width: 100%"></div>
                        <span id="playerHpText" class="absolute inset-0 flex items-center justify-center text-[9px] font-bold text-white drop-shadow-md leading-none">3/3</span>
                    </div>
                </div>
            </div>
            
            <div class="bg-gray-800/80 px-2 sm:px-3 py-1.5 rounded-lg border border-gray-700 text-xs text-center shrink-0">
                <span id="scoreText" class="font-bold text-amber-400">0 - 0</span>
            </div>

            <div class="flex items-center space-x-2 bg-red-950/70 px-3 py-1.5 rounded-xl border border-red-700/50 w-36 sm:w-44">
                <div class="flex flex-col w-full text-right">
                    <span id="enemyTankName" class="text-red-400 font-bold text-[10px] truncate">ENEMY</span>
                    <div class="w-full bg-gray-900 rounded-sm h-3 relative border border-red-900 overflow-hidden mt-0.5">
                        <div id="enemyHpBar" class="bg-red-500 h-full w-full transition-all duration-200" style="width: 100%"></div>
                        <span id="enemyHpText" class="absolute inset-0 flex items-center justify-center text-[9px] font-bold text-white drop-shadow-md leading-none">3/3</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tank Selectors -->
        <div class="flex items-center space-x-3">
            <div class="flex flex-col">
                <label class="text-[9px] text-emerald-400 font-bold uppercase mb-0.5">Player Tank</label>
                <select id="playerTankSelect" class="bg-emerald-950 text-white text-[11px] border border-emerald-700/50 rounded px-1 py-0.5 outline-none cursor-pointer max-w-[120px]"></select>
            </div>
            <div class="flex flex-col">
                <label class="text-[9px] text-red-400 font-bold uppercase mb-0.5">Enemy Tank</label>
                <select id="enemyTankSelect" class="bg-red-950 text-white text-[11px] border border-red-700/50 rounded px-1 py-0.5 outline-none cursor-pointer max-w-[120px]"></select>
            </div>
            <button id="restartBtn" class="bg-red-700 hover:bg-red-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition transform active:scale-95 shadow self-end h-[26px]">
                Restart
            </button>
        </div>
    </header>

    <main class="flex-1 relative overflow-hidden cursor-crosshair">
        <canvas id="simCanvas"></canvas>
        
        <!-- Game Over / Victory Overlay Modal -->
        <div id="gameOverModal" class="absolute inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center hidden z-30">
            <div class="bg-gray-900 border border-emerald-500/50 p-8 rounded-2xl text-center shadow-2xl max-w-md w-full mx-4">
                <h2 id="gameOverTitle" class="text-3xl font-black text-emerald-400 mb-2">VICTORY!</h2>
                <p id="gameOverDesc" class="text-gray-300 text-sm mb-6">You successfully destroyed the enemy tank.</p>
                <button id="nextRoundBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition shadow-lg glow-green">
                    Next Battle
                </button>
            </div>
        </div>

        <!-- Cooldown / Controls Badge -->
        <div class="absolute bottom-4 left-4 bg-gray-900/80 backdrop-blur border border-emerald-800/40 p-3 rounded-xl text-xs text-emerald-200 pointer-events-none hidden md:block">
            <p class="font-bold text-emerald-400 mb-1">Combat Status:</p>
            <p>• Cannon Cooldown: <span id="cooldownStatus" class="font-bold text-emerald-300">READY</span></p>
            <p>• Cover trees block shells and provide tactical defense.</p>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - document.querySelector('header').offsetHeight;
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Game state objects
        let player = null;
        let enemy = null;
        let trees = [];
        let projectiles = [];
        let explosions = [];
        let particles = [];
        
        let scorePlayer = 0;
        let scoreEnemy = 0;
        let isGameOver = false;

        // Input tracking for WASD and mouse
        const keys = { w: false, a: false, s: false, d: false };
        let mouseX = 0;
        let mouseY = 0;
        let isMouseDown = false;

        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = true;
            if (e.key === 'a' || e.key === 'A') keys.a = true;
            if (e.key === 's' || e.key === 'S') keys.s = true;
            if (e.key === 'd' || e.key === 'D') keys.d = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = false;
            if (e.key === 'a' || e.key === 'A') keys.a = false;
            if (e.key === 's' || e.key === 'S') keys.s = false;
            if (e.key === 'd' || e.key === 'D') keys.d = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0 && player && !isGameOver) {
                player.tryFire();
            }
        });

        // Utility Math functions
        function dist(x1, y1, x2, y2) {
            return Math.hypot(x2 - x1, y2 - y1);
        }

        function clamp(val, min, max) {
            return Math.max(min, Math.min(max, val));
        }

        const TANK_DATA = {
            "WW1": [
                { id: "mkiv", name: "Mark IV (UK)", hp: 8, speed: 1.2, reload: 180, damage: 2, projSpeed: 5 },
                { id: "a7v", name: "A7V (GER)", hp: 9, speed: 1.0, reload: 200, damage: 3, projSpeed: 5 },
                { id: "ft17", name: "Renault FT (FRA)", hp: 4, speed: 1.8, reload: 120, damage: 2, projSpeed: 6 },
                { id: "chamond", name: "St. Chamond (FRA)", hp: 7, speed: 1.4, reload: 240, damage: 4, projSpeed: 6 }
            ],
            "WW2": [
                { id: "m4", name: "M4 Sherman (USA)", hp: 8, speed: 2.2, reload: 150, damage: 3, projSpeed: 8 },
                { id: "t34", name: "T-34 (USSR)", hp: 8, speed: 2.5, reload: 160, damage: 3, projSpeed: 8 },
                { id: "tiger", name: "Tiger I (GER)", hp: 14, speed: 1.6, reload: 220, damage: 6, projSpeed: 9 },
                { id: "m10", name: "M10 Wolverine TD (USA)", hp: 6, speed: 2.6, reload: 140, damage: 5, projSpeed: 10 },
                { id: "stug", name: "StuG III TD (GER)", hp: 8, speed: 2.1, reload: 150, damage: 5, projSpeed: 9 }
            ],
            "Cold War": [
                { id: "m48", name: "M48 Patton (USA)", hp: 12, speed: 2.4, reload: 130, damage: 6, projSpeed: 10 },
                { id: "t55", name: "T-55 (USSR)", hp: 12, speed: 2.6, reload: 140, damage: 6, projSpeed: 10 },
                { id: "centurion", name: "Centurion (UK)", hp: 14, speed: 2.0, reload: 150, damage: 7, projSpeed: 11 },
                { id: "leo1", name: "Leopard 1 (GER)", hp: 8, speed: 3.2, reload: 110, damage: 7, projSpeed: 12 },
                { id: "su122", name: "SU-122-54 TD (USSR)", hp: 10, speed: 2.5, reload: 180, damage: 9, projSpeed: 11 }
            ],
            "Modern Era": [
                { id: "m1a2", name: "M1A2 Abrams (USA)", hp: 20, speed: 3.0, reload: 100, damage: 10, projSpeed: 15 },
                { id: "t90", name: "T-90 (RUS)", hp: 18, speed: 2.8, reload: 110, damage: 10, projSpeed: 14 },
                { id: "leo2a7", name: "Leopard 2A7 (GER)", hp: 18, speed: 3.1, reload: 95, damage: 10, projSpeed: 15 },
                { id: "cr2", name: "Challenger 2 (UK)", hp: 22, speed: 2.5, reload: 120, damage: 10, projSpeed: 14 }
            ]
        };

        function getTankData(id) {
            for (let era in TANK_DATA) {
                for (let tank of TANK_DATA[era]) {
                    if (tank.id === id) return tank;
                }
            }
            return TANK_DATA["WW2"][0]; // Fallback
        }

        function populateSelects() {
            const pSelect = document.getElementById('playerTankSelect');
            const eSelect = document.getElementById('enemyTankSelect');
            let html = '';
            for (let era in TANK_DATA) {
                html += `<optgroup label="${era}">`;
                for (let tank of TANK_DATA[era]) {
                    html += `<option value="${tank.id}">${tank.name}</option>`;
                }
                html += `</optgroup>`;
            }
            pSelect.innerHTML = html;
            eSelect.innerHTML = html;
            
            pSelect.value = 'm4';
            eSelect.value = 'tiger';
        }

        class Tree {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 22 + Math.random() * 12;
                this.swayOffset = Math.random() * Math.PI * 2;
            }

            draw(ctx, time) {
                ctx.save();
                const sway = Math.sin(time * 0.002 + this.swayOffset) * 2;
                
                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.beginPath();
                ctx.arc(this.x, this.y + 4, this.radius * 0.8, 0, Math.PI * 2);
                ctx.fill();

                // Pine / Cover Canopy
                ctx.fillStyle = '#1e3f20';
                ctx.beginPath();
                ctx.moveTo(this.x + sway, this.y - this.radius * 1.5);
                ctx.lineTo(this.x - this.radius + sway*0.5, this.y + this.radius);
                ctx.lineTo(this.x + this.radius + sway*0.5, this.y + this.radius);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#2d5a27';
                ctx.beginPath();
                ctx.moveTo(this.x + sway*0.8, this.y - this.radius * 1.1);
                ctx.lineTo(this.x - this.radius * 0.7 + sway*0.4, this.y + this.radius * 0.5);
                ctx.lineTo(this.x + this.radius * 0.7 + sway*0.4, this.y + this.radius * 0.5);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }
        }

        class Tank {
            constructor(x, y, isPlayer, tankTypeId) {
                this.x = x;
                this.y = y;
                this.isPlayer = isPlayer;
                this.radius = 18;
                this.angle = 0;
                this.turretAngle = 0;
                
                // Fetch Historical Stats
                const stats = getTankData(tankTypeId);
                this.tankName = stats.name;
                this.speed = stats.speed;
                this.hp = stats.hp; 
                this.maxHp = stats.hp;
                this.reloadCooldown = 0; 
                this.maxCooldown = stats.reload; 
                this.damage = stats.damage;
                this.projSpeed = stats.projSpeed;
                
                this.color = isPlayer ? '#166534' : '#991b1b'; 
                this.trackColor = isPlayer ? '#052e16' : '#450a0a';
                this.turretColor = isPlayer ? '#15803d' : '#b91c1c';
            }

            tryFire() {
                if (this.reloadCooldown <= 0) {
                    let muzzleX = this.x + Math.cos(this.turretAngle) * 28;
                    let muzzleY = this.y + Math.sin(this.turretAngle) * 28;
                    projectiles.push(new Projectile(muzzleX, muzzleY, this.turretAngle, this, this.damage, this.projSpeed));
                    this.reloadCooldown = this.maxCooldown;

                    for (let i = 0; i < 5; i++) {
                        particles.push(new Particle(muzzleX, muzzleY, '#fbbf24', 3, 12));
                    }
                }
            }

            update(trees, opponent) {
                if (this.reloadCooldown > 0) {
                    this.reloadCooldown--;
                }

                if (this.isPlayer) {
                    // Player movement with WASD
                    let moveX = 0;
                    let moveY = 0;
                    if (keys.w) moveY -= 1;
                    if (keys.s) moveY += 1;
                    if (keys.a) moveX -= 1;
                    if (keys.d) moveX += 1;

                    if (moveX !== 0 || moveY !== 0) {
                        let targetAngle = Math.atan2(moveY, moveX);
                        this.angle = targetAngle;
                        let nextX = this.x + Math.cos(targetAngle) * this.speed;
                        let nextY = this.y + Math.sin(targetAngle) * this.speed;

                        // Collision with boundaries and trees
                        if (!this.checkCollision(nextX, nextY, trees)) {
                            this.x = nextX;
                            this.y = nextY;
                        }
                    }

                    // Mouse Aiming for Turret
                    this.turretAngle = Math.atan2(mouseY - this.y, mouseX - this.x);

                } else {
                    // Computer Enemy AI Behavior
                    let d = dist(this.x, this.y, player.x, player.y);
                    let targetAngle = Math.atan2(player.y - this.y, player.x - this.x);

                    // Turret always aims at player
                    let angleDiff = targetAngle - this.turretAngle;
                    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                    this.turretAngle += angleDiff * 0.1;

                    // Movement AI: Approach if far, maintain tactical standoff if close
                    let desiredDist = 200;
                    let moveAngle = targetAngle;
                    if (d < desiredDist - 40) {
                        moveAngle += Math.PI; // back up
                    } else if (d > desiredDist + 60) {
                        // approach
                    } else {
                        moveAngle += Math.PI / 2; // strafe sideways around player
                    }

                    // --- Obstacle Avoidance Logic ---
                    // Look ahead a short distance to see if a tree is in the way
                    let lookAheadDist = 60;
                    let projectedX = this.x + Math.cos(moveAngle) * lookAheadDist;
                    let projectedY = this.y + Math.sin(moveAngle) * lookAheadDist;
                    
                    let avoidanceAngleOffset = 0;
                    let closestTree = null;
                    let closestTreeDist = Infinity;

                    // Find the most threatening tree in our intended path
                    for (let tree of trees) {
                        // Rough bounding box check first for efficiency
                        if (Math.abs(tree.x - this.x) > lookAheadDist + tree.radius || 
                            Math.abs(tree.y - this.y) > lookAheadDist + tree.radius) continue;

                        let distToTree = dist(this.x, this.y, tree.x, tree.y);
                        
                        // If it's close enough to matter
                        if (distToTree < lookAheadDist + tree.radius) {
                            // Calculate angle to the tree
                            let angleToTree = Math.atan2(tree.y - this.y, tree.x - this.x);
                            
                            // Check if the tree is roughly in our intended direction of travel
                            let angleDiffToTree = moveAngle - angleToTree;
                            while (angleDiffToTree < -Math.PI) angleDiffToTree += Math.PI * 2;
                            while (angleDiffToTree > Math.PI) angleDiffToTree -= Math.PI * 2;
                            
                            // If the tree is within our front cone
                            if (Math.abs(angleDiffToTree) < Math.PI / 3) {
                                if (distToTree < closestTreeDist) {
                                    closestTreeDist = distToTree;
                                    closestTree = tree;
                                    
                                    // Steer away from the tree based on which side it's on
                                    // If tree is to our right (angleDiff is negative), steer left (positive)
                                    // Steer harder the closer the tree is
                                    let steerDirection = Math.sign(angleDiffToTree) || 1; 
                                    let steerIntensity = (1 - (distToTree / (lookAheadDist + tree.radius))) * 1.5;
                                    avoidanceAngleOffset = steerDirection * steerIntensity * (Math.PI / 2);
                                }
                            }
                        }
                    }

                    // Apply avoidance steering
                    this.angle = moveAngle + avoidanceAngleOffset;
                    
                    let nextX = this.x + Math.cos(this.angle) * (this.speed * 0.85);
                    let nextY = this.y + Math.sin(this.angle) * (this.speed * 0.85);

                    // Final safety check before committing move
                    if (!this.checkCollision(nextX, nextY, trees)) {
                        this.x = nextX;
                        this.y = nextY;
                    } else {
                        // If standard move failed due to collision, try desperately sliding along the obstacle
                        // by checking slightly altered angles
                        let slid = false;
                        for(let offset of [Math.PI/4, -Math.PI/4, Math.PI/2, -Math.PI/2]) {
                            let slideNextX = this.x + Math.cos(this.angle + offset) * (this.speed * 0.85);
                            let slideNextY = this.y + Math.sin(this.angle + offset) * (this.speed * 0.85);
                            if (!this.checkCollision(slideNextX, slideNextY, trees)) {
                                this.x = slideNextX;
                                this.y = slideNextY;
                                this.angle += offset;
                                slid = true;
                                break;
                            }
                        }
                    }

                    // Enemy shooting logic (only shoot if there isn't a tree blocking the shot)
                    if (this.reloadCooldown <= 0 && d < 450) {
                        let clearLineOfSight = true;
                        
                        // Simple raycast to check for trees blocking the shot to the player
                        let rayDist = 0;
                        let rayStep = 10;
                        let rayAngle = this.turretAngle;
                        let maxRayDist = d; // Only check up to the player's distance
                        
                        while(rayDist < maxRayDist) {
                            let checkX = this.x + Math.cos(rayAngle) * rayDist;
                            let checkY = this.y + Math.sin(rayAngle) * rayDist;
                            
                            for (let tree of trees) {
                                if (dist(checkX, checkY, tree.x, tree.y) < tree.radius) {
                                    clearLineOfSight = false;
                                    break;
                                }
                            }
                            if(!clearLineOfSight) break;
                            rayDist += rayStep;
                        }

                        if (clearLineOfSight) {
                            this.tryFire();
                        }
                    }
                }

                // Keep inside bounds
                this.x = clamp(this.x, 30, canvas.width - 30);
                this.y = clamp(this.y, 30, canvas.height - 30);
            }

            checkCollision(nextX, nextY, trees) {
                // Check tree collision
                for (let tree of trees) {
                    if (dist(nextX, nextY, tree.x, tree.y) < this.radius + tree.radius) {
                        return true;
                    }
                }
                return false;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Tracks
                ctx.save();
                ctx.rotate(this.angle);
                ctx.fillStyle = this.trackColor;
                ctx.fillRect(-18, -20, 36, 10);
                ctx.fillRect(-18, 10, 36, 10);

                // Hull Body
                ctx.fillStyle = this.color;
                ctx.fillRect(-15, -13, 30, 26);
                ctx.restore();

                // Turret & Barrel
                ctx.rotate(this.turretAngle);
                ctx.fillStyle = this.turretColor;
                ctx.beginPath();
                ctx.arc(0, 0, 11, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = this.trackColor;
                ctx.stroke();

                ctx.fillStyle = this.trackColor;
                ctx.fillRect(0, -4, 26, 8);

                ctx.restore();
            }
        }

        class Projectile {
            constructor(x, y, angle, shooter, damage, speed) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.speed = speed;
                this.shooter = shooter;
                this.damage = damage;
                this.radius = 4;
                this.active = true;
            }

            update(trees, playerTank, enemyTank) {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                // Out of bounds check
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.active = false;
                    return;
                }

                // Check collision with trees (Cover absorbs projectile)
                for (let tree of trees) {
                    if (dist(this.x, this.y, tree.x, tree.y) < tree.radius + this.radius) {
                        this.active = false;
                        explosions.push(new Explosion(this.x, this.y, '#b45309'));
                        for (let i = 0; i < 6; i++) {
                            particles.push(new Particle(this.x, this.y, '#f59e0b', 3, 10));
                        }
                        return;
                    }
                }

                // Check collision with Enemy if shot by Player
                if (this.shooter.isPlayer && dist(this.x, this.y, enemyTank.x, enemyTank.y) < enemyTank.radius + this.radius) {
                    this.active = false;
                    enemyTank.hp -= this.damage;
                    explosions.push(new Explosion(this.x, this.y, '#ef4444'));
                    for (let i = 0; i < 4 * this.damage; i++) {
                        particles.push(new Particle(this.x, this.y, '#f87171', 4, 15));
                    }
                    if (enemyTank.hp <= 0) {
                        triggerGameOver(true);
                    }
                    return;
                }

                // Check collision with Player if shot by Enemy
                if (!this.shooter.isPlayer && dist(this.x, this.y, playerTank.x, playerTank.y) < playerTank.radius + this.radius) {
                    this.active = false;
                    playerTank.hp -= this.damage;
                    explosions.push(new Explosion(this.x, this.y, '#ef4444'));
                    for (let i = 0; i < 4 * this.damage; i++) {
                        particles.push(new Particle(this.x, this.y, '#f87171', 4, 15));
                    }
                    if (playerTank.hp <= 0) {
                        triggerGameOver(false);
                    }
                    return;
                }
            }

            draw(ctx) {
                ctx.fillStyle = '#fef08a';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Explosion {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.radius = 6;
                this.maxRadius = 30 + Math.random() * 15;
                this.color = color;
                this.alpha = 1.0;
            }

            update() {
                this.radius += 2.2;
                this.alpha -= 0.07;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color, size, life) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 5;
                this.vy = (Math.random() - 0.5) * 5;
                this.color = color;
                this.size = size;
                this.life = life;
                this.maxLife = life;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
                this.size *= 0.94;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.life / this.maxLife;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
        }

        function initBattle() {
            isGameOver = false;
            document.getElementById('gameOverModal').classList.add('hidden');

            // Ensure dimensions are current before positioning
            resizeCanvas();

            // Setup dynamic, randomized opposite corner spawn points
            const marginX = Math.max(80, canvas.width * 0.1);
            const marginY = Math.max(80, canvas.height * 0.1);

            // Determine randomized opposite corners for spawn points
            const spawnTopLeftBottomRight = Math.random() > 0.5;
            const playerGetsFirst = Math.random() > 0.5;

            let pos1, pos2;

            if (spawnTopLeftBottomRight) {
                // Top-Left and Bottom-Right corners
                pos1 = { x: marginX, y: marginY }; 
                pos2 = { x: canvas.width - marginX, y: canvas.height - marginY };
            } else {
                // Top-Right and Bottom-Left corners
                pos1 = { x: canvas.width - marginX, y: marginY };
                pos2 = { x: marginX, y: canvas.height - marginY };
            }

            // Assign to player and enemy
            const playerSpawn = playerGetsFirst ? pos1 : pos2;
            const enemySpawn = playerGetsFirst ? pos2 : pos1;

            const pId = document.getElementById('playerTankSelect').value || "m4";
            const eId = document.getElementById('enemyTankSelect').value || "tiger";

            player = new Tank(playerSpawn.x, playerSpawn.y, true, pId);
            enemy = new Tank(enemySpawn.x, enemySpawn.y, false, eId);

            projectiles = [];
            explosions = [];
            particles = [];

            // Randomly spawn cover trees clustered in the middle ground between the corners
            trees = [];
            const numTrees = 12 + Math.floor(Math.random() * 8);
            
            // Calculate vector between player and enemy
            const dx = enemy.x - player.x;
            const dy = enemy.y - player.y;
            const distBetween = Math.hypot(dx, dy);
            
            // Perpendicular vector to create width in the band of trees
            const perpX = -dy / distBetween;
            const perpY = dx / distBetween;

            for (let i = 0; i < numTrees; i++) {
                let tx, ty, safe;
                let attempts = 0;
                do {
                    // Position along the path connecting the two tanks (20% to 80% mark)
                    let t = 0.2 + (Math.random() * 0.6); 
                    let baseX = player.x + dx * t;
                    let baseY = player.y + dy * t;

                    // Add lateral spread
                    let maxSpread = 200 * Math.sin(t * Math.PI); 
                    let spreadOffset = (Math.random() - 0.5) * maxSpread * 2;

                    tx = baseX + perpX * spreadOffset;
                    ty = baseY + perpY * spreadOffset;
                    
                    // Constrain trees strictly within canvas bounds
                    tx = clamp(tx, 40, canvas.width - 40);
                    ty = clamp(ty, 40, canvas.height - 40);

                    safe = dist(tx, ty, player.x, player.y) > 100 && dist(tx, ty, enemy.x, enemy.y) > 100;
                    attempts++;
                } while (!safe && attempts < 50);

                if (safe) {
                    trees.push(new Tree(tx, ty));
                }
            }

            updateHUD();
        }

        function triggerGameOver(playerWon) {
            isGameOver = true;
            if (playerWon) {
                scorePlayer++;
                document.getElementById('gameOverTitle').innerText = "VICTORY!";
                document.getElementById('gameOverTitle').className = "text-3xl font-black text-emerald-400 mb-2";
                document.getElementById('gameOverDesc').innerText = "You successfully destroyed the enemy tank!";
            } else {
                scoreEnemy++;
                document.getElementById('gameOverTitle').innerText = "DEFEAT";
                document.getElementById('gameOverTitle').className = "text-3xl font-black text-red-500 mb-2";
                document.getElementById('gameOverDesc').innerText = "Your tank was destroyed by the computer opponent.";
            }
            document.getElementById('scoreText').innerText = `Player ${scorePlayer} - ${scoreEnemy} Enemy`;
            document.getElementById('gameOverModal').classList.remove('hidden');
        }

        function updateHUD() {
            // Player HP display
            const playerHpBar = document.getElementById('playerHpBar');
            const playerHpText = document.getElementById('playerHpText');
            const pPct = Math.max(0, (player.hp / player.maxHp) * 100);
            playerHpBar.style.width = pPct + '%';
            playerHpText.innerText = `${Math.max(0, player.hp)}/${player.maxHp}`;
            document.getElementById('playerTankName').innerText = player.tankName;

            // Enemy HP display
            const enemyHpBar = document.getElementById('enemyHpBar');
            const enemyHpText = document.getElementById('enemyHpText');
            const ePct = Math.max(0, (enemy.hp / enemy.maxHp) * 100);
            enemyHpBar.style.width = ePct + '%';
            enemyHpText.innerText = `${Math.max(0, enemy.hp)}/${enemy.maxHp}`;
            document.getElementById('enemyTankName').innerText = enemy.tankName;

            // Cooldown indicator
            const cooldownEl = document.getElementById('cooldownStatus');
            if (player.reloadCooldown <= 0) {
                cooldownEl.innerText = "READY";
                cooldownEl.className = "font-bold text-emerald-300";
            } else {
                const secondsLeft = (player.reloadCooldown / 60).toFixed(1);
                cooldownEl.innerText = `${secondsLeft}s`;
                cooldownEl.className = "font-bold text-amber-400";
            }
        }

        document.getElementById('restartBtn').addEventListener('click', initBattle);
        document.getElementById('nextRoundBtn').addEventListener('click', initBattle);

        let frameCount = 0;
        function gameLoop() {
            frameCount++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!isGameOver && player && enemy) {
                player.update(trees, enemy);
                enemy.update(trees, player);

                projectiles.forEach(p => p.update(trees, player, enemy));
                projectiles = projectiles.filter(p => p.active);
            }

            // Draw Trees (Cover)
            trees.forEach(tree => tree.draw(ctx, frameCount));

            // Draw Tanks
            if (player) player.draw(ctx);
            if (enemy) enemy.draw(ctx);

            // Draw Projectiles
            projectiles.forEach(p => p.draw(ctx));

            // Update & Draw Explosions
            explosions.forEach(exp => exp.update());
            explosions = explosions.filter(exp => exp.alpha > 0);
            explosions.forEach(exp => exp.draw(ctx));

            // Update & Draw Particles
            particles.forEach(pt => pt.update());
            particles = particles.filter(pt => pt.life > 0);
            particles.forEach(pt => pt.draw(ctx));

            if (player) {
                updateHUD();
            }

            requestAnimationFrame(gameLoop);
        }

        window.onload = function() {
            populateSelects();
            initBattle();
            gameLoop();
        };
    </script>
</body>
</html>
