<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Tank Duel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0d160d; font-family: 'Inter', sans-serif; user-select: none; }
        
        main {
            display: flex;
            align-items: center;
            justify-content: center;
            height: calc(100vh - 74px);
            width: 100vw;
        }

        canvas {
            background: radial-gradient(circle, #223822 0%, #0d160d 100%);
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 1200 / 800;
            object-fit: contain;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        
        .glow-green { box-shadow: 0 0 25px rgba(74, 222, 128, 0.4); }
    </style>
</head>
<body class="flex flex-col h-screen text-gray-100">

    <header id="gameHeader" class="bg-gray-900/90 border-b border-emerald-800/50 p-4 flex flex-wrap justify-between items-center shadow-lg h-[74px]">
        <div class="flex items-center space-x-3">
            <div class="bg-emerald-600 text-white font-black px-3.5 py-1.5 rounded-xl text-lg tracking-wider glow-green">
                TANK DUEL ONLINE
            </div>
            <select id="tankSelect" class="bg-gray-800 text-emerald-400 font-bold border border-emerald-700/50 rounded-lg px-2 py-1 text-xs outline-none cursor-pointer" title="Change Tank (Applies next round)"></select>
        </div>

        <div class="flex items-center space-x-3 text-sm flex-1 justify-center">
            <div class="flex items-center space-x-2 bg-emerald-950/70 px-3 py-1.5 rounded-xl border border-emerald-700/50 w-44">
                <div class="flex flex-col w-full">
                    <span id="playerTankName" class="text-emerald-400 font-bold text-[10px] truncate">YOU</span>
                    <div class="w-full bg-gray-900 rounded-sm h-3 relative border border-emerald-900 overflow-hidden mt-0.5">
                        <div id="playerHpBar" class="bg-emerald-500 h-full w-full transition-all duration-200" style="width: 100%"></div>
                    </div>
                </div>
            </div>
            
            <div class="bg-gray-800/80 px-4 py-1.5 rounded-lg border border-gray-700 text-xs text-center shrink-0">
                <span id="scoreText" class="font-bold text-amber-400">0 - 0</span>
            </div>

            <div class="flex items-center space-x-2 bg-red-950/70 px-3 py-1.5 rounded-xl border border-red-700/50 w-44">
                <div class="flex flex-col w-full text-right">
                    <span id="enemyTankName" class="text-red-400 font-bold text-[10px] truncate">ENEMY</span>
                    <div class="w-full bg-gray-900 rounded-sm h-3 relative border border-red-900 overflow-hidden mt-0.5 ml-auto">
                        <div id="enemyHpBar" class="bg-red-500 h-full w-full transition-all duration-200" style="width: 100%"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="text-[10px] font-bold text-gray-500 text-right uppercase">
            Cooldown: <span id="cooldownStatus" class="text-emerald-300">READY</span><br/>
            <span class="text-[9px] text-emerald-500/70 hidden sm:inline">Hold SHIFT to Auto-Aim (Modern Tanks)</span>
        </div>
    </header>

    <main class="relative cursor-crosshair">
        <canvas id="simCanvas" width="1200" height="800"></canvas>
        
        <div id="lobbyModal" class="absolute inset-0 bg-black/80 backdrop-blur flex items-center justify-center z-40">
            <div class="bg-gray-900 border border-emerald-500/50 p-8 rounded-2xl text-center shadow-2xl max-w-sm w-full mx-4">
                <h2 class="text-2xl font-black text-emerald-400 mb-2">JOIN MATCH</h2>
                <p class="text-gray-400 text-xs mb-6">Connect to the server to play.</p>
                <button id="joinBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition shadow-lg glow-green">
                    Connect & Ready Up
                </button>
                <p id="lobbyStatus" class="text-amber-400 text-sm font-bold mt-4 hidden animate-pulse">Connecting to server...</p>
                <p id="lobbyError" class="text-red-500 text-sm font-bold mt-4 hidden"></p>
            </div>
        </div>
        
        <div id="gameOverModal" class="absolute inset-0 bg-black/70 flex items-center justify-center z-30 hidden">
            <div class="text-center">
                <h2 id="gameOverTitle" class="text-6xl font-black mb-4 drop-shadow-lg tracking-widest">VICTORY</h2>
                <p class="text-white text-lg">Next round starting soon...</p>
            </div>
        </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    
    <script>
        const TANK_DATA = {
            "WW1": [{ id: "mkiv", name: "Mark IV (UK)" }, { id: "a7v", name: "A7V (GER)" }, { id: "ft17", name: "Renault FT (FRA)" }],
            "WW2": [{ id: "m4", name: "M4 Sherman (USA)" }, { id: "t34", name: "T-34 (USSR)" }, { id: "tiger", name: "Tiger I (GER)" }, { id: "stug", name: "StuG III TD (GER)" }],
            "Cold War": [{ id: "m48", name: "M48 Patton (USA)" }, { id: "t55", name: "T-55 (USSR)" }, { id: "leo1", name: "Leopard 1 (GER)" }],
            "Modern Era": [{ id: "m1a2", name: "M1A2 Abrams (USA)" }, { id: "t90", name: "T-90 (RUS)" }]
        };

        const select = document.getElementById('tankSelect');
        let html = '';
        for (let era in TANK_DATA) {
            html += `<optgroup label="${era}">`;
            for (let t of TANK_DATA[era]) html += `<option value="${t.id}">${t.name}</option>`;
            html += `</optgroup>`;
        }
        select.innerHTML = html;
        select.value = "m4";

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        
        let socket;
        let myId = null;
        let serverState = { players: {}, projectiles: [] };
        let trees = [];
        
        // Visuals only memory
        let clientTanks = {};
        let explosions = [];
        let particles = [];

        // Track Keyboard and Mouse
        const inputs = { w: false, a: false, s: false, d: false, shift: false, mouseX: 0, mouseY: 0, mouseDown: false };

        select.addEventListener('change', (e) => {
            if (socket && socket.connected) socket.emit('changeTank', e.target.value);
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            inputs.mouseX = (e.clientX - rect.left) * scaleX;
            inputs.mouseY = (e.clientY - rect.top) * scaleY;
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') inputs.w = true;
            if (e.key === 'a' || e.key === 'A') inputs.a = true;
            if (e.key === 's' || e.key === 'S') inputs.s = true;
            if (e.key === 'd' || e.key === 'D') inputs.d = true;
            if (e.key === 'Shift') inputs.shift = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') inputs.w = false;
            if (e.key === 'a' || e.key === 'A') inputs.a = false;
            if (e.key === 's' || e.key === 'S') inputs.s = false;
            if (e.key === 'd' || e.key === 'D') inputs.d = false;
            if (e.key === 'Shift') inputs.shift = false;
        });

        canvas.addEventListener('mousedown', (e) => { if (e.button === 0) inputs.mouseDown = true; });
        canvas.addEventListener('mouseup', (e) => { if (e.button === 0) inputs.mouseDown = false; });

        document.getElementById('joinBtn').addEventListener('click', () => {
            document.getElementById('joinBtn').classList.add('hidden');
            document.getElementById('lobbyStatus').classList.remove('hidden');
            document.getElementById('lobbyStatus').innerText = "Connecting...";
            
            try {
                socket = io();

                socket.on('connect', () => {
                    document.getElementById('lobbyStatus').innerText = "Waiting for Opponent...";
                    socket.emit('join', select.value);
                });

                socket.on('init', (id) => { myId = id; });

                socket.on('gameStart', (data) => {
                    document.getElementById('lobbyModal').classList.add('hidden');
                    document.getElementById('gameOverModal').classList.add('hidden');
                    trees = data.trees;
                    explosions = [];
                    particles = [];
                });

                socket.on('stateUpdate', (data) => {
                    serverState = data;
                    updateHUD();
                });

                socket.on('playerLeft', () => {
                    document.getElementById('lobbyModal').classList.remove('hidden');
                    document.getElementById('lobbyStatus').innerText = "Opponent disconnected. Waiting...";
                });

                socket.on('lobbyError', (msg) => {
                    document.getElementById('lobbyStatus').classList.add('hidden');
                    document.getElementById('lobbyError').classList.remove('hidden');
                    document.getElementById('lobbyError').innerText = msg;
                });

                socket.on('gameOver', (data) => {
                    const modal = document.getElementById('gameOverModal');
                    const title = document.getElementById('gameOverTitle');
                    modal.classList.remove('hidden');
                    if (data.winnerId === myId) {
                        title.innerText = "VICTORY";
                        title.className = "text-6xl font-black mb-4 drop-shadow-lg tracking-widest text-emerald-400";
                    } else {
                        title.innerText = "DEFEAT";
                        title.className = "text-6xl font-black mb-4 drop-shadow-lg tracking-widest text-red-500";
                    }
                });

                socket.on('effect', (data) => {
                    if (data.type === 'fire') {
                        for (let i = 0; i < 5; i++) {
                            particles.push({ x: data.x, y: data.y, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, color: '#fbbf24', size: 3, life: 12, maxLife: 12 });
                        }
                    } else if (data.type === 'hitTree') {
                        explosions.push({ x: data.x, y: data.y, radius: 6, color: '#b45309', alpha: 1.0 });
                        for (let i = 0; i < 6; i++) {
                            particles.push({ x: data.x, y: data.y, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, color: '#f59e0b', size: 3, life: 10, maxLife: 10 });
                        }
                    } else if (data.type === 'hitTank') {
                        explosions.push({ x: data.x, y: data.y, radius: 6, color: '#ef4444', alpha: 1.0 });
                        for (let i = 0; i < 4 * data.damage; i++) {
                            particles.push({ x: data.x, y: data.y, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8, color: '#f87171', size: 4, life: 15, maxLife: 15 });
                        }
                    }
                });

                // Send inputs rapidly for smooth server movement
                setInterval(() => {
                    if (myId) socket.emit('input', inputs);
                }, 1000 / 60);

            } catch(e) {
                document.getElementById('lobbyStatus').classList.add('hidden');
                document.getElementById('lobbyError').classList.remove('hidden');
                document.getElementById('lobbyError').innerText = "Unable to connect.";
            }
        });

        function getTankName(id) {
            for (let era in TANK_DATA) {
                let match = TANK_DATA[era].find(t => t.id === id);
                if (match) return match.name;
            }
            return "UNKNOWN TANK";
        }

        function updateHUD() {
            if (!myId || !serverState.players[myId]) return;

            const me = serverState.players[myId];
            let enemyId = serverState.p1Id === myId ? serverState.p2Id : serverState.p1Id;
            const enemy = enemyId ? serverState.players[enemyId] : null;

            document.getElementById('playerHpBar').style.width = Math.max(0, (me.hp / me.maxHp) * 100) + '%';
            document.getElementById('playerTankName').innerText = getTankName(me.tankTypeId);
            
            const cdEl = document.getElementById('cooldownStatus');
            if (me.reloadCooldown <= 0) {
                cdEl.innerText = "READY";
                cdEl.className = "text-emerald-300 font-black";
            } else {
                cdEl.innerText = "RELOADING";
                cdEl.className = "text-amber-500";
            }

            if (enemy) {
                document.getElementById('enemyHpBar').style.width = Math.max(0, (enemy.hp / enemy.maxHp) * 100) + '%';
                document.getElementById('enemyTankName').innerText = getTankName(enemy.tankTypeId);
            } else {
                document.getElementById('enemyHpBar').style.width = '0%';
                document.getElementById('enemyTankName').innerText = "WAITING...";
            }

            let myScore = serverState.p1Id === myId ? serverState.scores.p1 : serverState.scores.p2;
            let enemyScore = serverState.p1Id === myId ? serverState.scores.p2 : serverState.scores.p1;
            document.getElementById('scoreText').innerText = `${myScore} - ${enemyScore}`;
        }

        function drawTree(ctx, tree, time) {
            ctx.save();
            const sway = Math.sin(time * 0.002 + tree.swayOffset) * 2;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.beginPath(); ctx.arc(tree.x, tree.y + 4, tree.radius * 0.8, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#1e3f20';
            ctx.beginPath(); ctx.moveTo(tree.x + sway, tree.y - tree.radius * 1.5); ctx.lineTo(tree.x - tree.radius + sway*0.5, tree.y + tree.radius); ctx.lineTo(tree.x + tree.radius + sway*0.5, tree.y + tree.radius); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#2d5a27';
            ctx.beginPath(); ctx.moveTo(tree.x + sway*0.8, tree.y - tree.radius * 1.1); ctx.lineTo(tree.x - tree.radius * 0.7 + sway*0.4, tree.y + tree.radius * 0.5); ctx.lineTo(tree.x + tree.radius * 0.7 + sway*0.4, tree.y + tree.radius * 0.5); ctx.closePath(); ctx.fill();
            ctx.restore();
        }

        function drawTank(ctx, p, isMe) {
            ctx.save();
            ctx.translate(p.x, p.y);
            const color = isMe ? '#166534' : '#991b1b';
            const trackColor = isMe ? '#052e16' : '#450a0a';
            const turretColor = isMe ? '#15803d' : '#b91c1c';

            ctx.save();
            ctx.rotate(p.angle);
            ctx.fillStyle = trackColor;
            ctx.fillRect(-18, -20, 36, 10); ctx.fillRect(-18, 10, 36, 10);
            ctx.fillStyle = color;
            ctx.fillRect(-15, -13, 30, 26);
            ctx.restore();

            ctx.rotate(p.turretAngle);
            ctx.fillStyle = turretColor;
            ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill();
            ctx.lineWidth = 2; ctx.strokeStyle = trackColor; ctx.stroke();
            ctx.fillStyle = trackColor;
            ctx.fillRect(0, -4, 26, 8);
            ctx.restore();
        }

        let frameCount = 0;
        function renderLoop() {
            frameCount++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Tactical Map Grid
            ctx.strokeStyle = 'rgba(74, 222, 128, 0.05)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= canvas.width; x += 100) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
            for (let y = 0; y <= canvas.height; y += 100) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
            ctx.fillStyle = 'rgba(74, 222, 128, 0.15)'; ctx.font = 'bold 10px Inter'; ctx.fillText("GRID SCALE: 100m", 15, canvas.height - 15);

            // Client-Side Aimbot logic
            if (inputs.shift && myId && serverState.players[myId]) {
                const stabTanks = ['m4', 'm48', 't55', 'leo1', 'm1a2', 't90'];
                let me = serverState.players[myId];
                if (stabTanks.includes(me.tankTypeId)) {
                    let enemyId = serverState.p1Id === myId ? serverState.p2Id : serverState.p1Id;
                    let enemy = serverState.players[enemyId];
                    if (enemy && enemy.hp > 0) {
                        inputs.mouseX = enemy.x; inputs.mouseY = enemy.y;
                        ctx.strokeStyle = 'rgba(239, 68, 68, 0.6)'; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.arc(enemy.x, enemy.y, 25, 0, Math.PI * 2); ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(enemy.x - 35, enemy.y); ctx.lineTo(enemy.x - 15, enemy.y);
                        ctx.moveTo(enemy.x + 35, enemy.y); ctx.lineTo(enemy.x + 15, enemy.y);
                        ctx.moveTo(enemy.x, enemy.y - 35); ctx.lineTo(enemy.x, enemy.y - 15);
                        ctx.moveTo(enemy.x, enemy.y + 35); ctx.lineTo(enemy.x, enemy.y + 15);
                        ctx.stroke();
                    }
                }
            }

            trees.forEach(tree => drawTree(ctx, tree, frameCount));

            // Smooth Interpolation Drawing
            for (let id in serverState.players) {
                let p = serverState.players[id];
                if (!p || p.hp <= 0) { delete clientTanks[id]; continue; }
                
                if (!clientTanks[id]) clientTanks[id] = { x: p.x, y: p.y, angle: p.angle, turretAngle: p.turretAngle };
                let ct = clientTanks[id];
                
                if (Math.hypot(p.x - ct.x, p.y - ct.y) > 100) { ct.x = p.x; ct.y = p.y; } 
                else { ct.x += (p.x - ct.x) * 0.35; ct.y += (p.y - ct.y) * 0.35; }
                
                let aDiff = p.angle - ct.angle; while (aDiff < -Math.PI) aDiff += Math.PI * 2; while (aDiff > Math.PI) aDiff -= Math.PI * 2; ct.angle += aDiff * 0.35;
                let tDiff = p.turretAngle - ct.turretAngle; while (tDiff < -Math.PI) tDiff += Math.PI * 2; while (tDiff > Math.PI) tDiff -= Math.PI * 2; ct.turretAngle += tDiff * 0.4;

                let interpolatedTank = { ...p, x: ct.x, y: ct.y, angle: ct.angle, turretAngle: ct.turretAngle };
                drawTank(ctx, interpolatedTank, id === myId);
            }

            ctx.fillStyle = '#fef08a';
            serverState.projectiles.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
            });

            explosions.forEach(exp => {
                exp.radius += 2.2; exp.alpha -= 0.07;
                ctx.save(); ctx.globalAlpha = Math.max(0, exp.alpha); ctx.fillStyle = exp.color;
                ctx.beginPath(); ctx.arc(exp.x, exp.y, exp.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore();
            });
            explosions = explosions.filter(exp => exp.alpha > 0);

            particles.forEach(pt => {
                pt.x += pt.vx; pt.y += pt.vy; pt.life--; pt.size *= 0.94;
                ctx.save(); ctx.globalAlpha = pt.life / pt.maxLife; ctx.fillStyle = pt.color;
                ctx.fillRect(pt.x, pt.y, pt.size, pt.size); ctx.restore();
            });
            particles = particles.filter(pt => pt.life > 0);

            requestAnimationFrame(renderLoop);
        }

        renderLoop();

    </script>
</body>
</html>
